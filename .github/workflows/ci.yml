name: CI

# In-repo quality gate. Previously the only test automation was the Xcode Cloud
# post-clone secret script, configured invisibly in App Store Connect — nothing
# in the repo proved the tests ran. This workflow runs the iOS unit tests and
# typechecks/lints the two TypeScript admin surfaces on every push and PR.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS unit tests
    # The app uses the iOS 26 Liquid Glass API (`Glass`), which Xcode 16 cannot
    # parse even behind @available. macOS 26 runners ship Xcode 26.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Create placeholder secrets
        # The build's Info.plist references $(SUPABASE_URL)/$(SUPABASE_ANON_KEY)
        # via Config/Secrets.xcconfig, which is gitignored.
        # Unit tests never hit the network, so the placeholder values from the
        # template are sufficient to compile and run. (Secrets-Dev.xcconfig is
        # optionally included and absent here, so Debug falls back to these.)
        run: cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig

      - name: Check secrets config
        # Catches the two ways this layer rots: an Info.plist growing a new
        # $(VAR) that nobody added to the template (every machine then builds
        # with an empty value), and the real Secrets.xcconfig being committed.
        # Placeholders are NOT rejected here — the step above installs them on
        # purpose, since the unit tests never hit the network. The release path
        # (ci_scripts/ci_post_clone.sh) is where placeholders are fatal.
        run: ./Scripts/check-secrets-config.sh

      - name: Verify Screen Time callback contract
        run: python3 Scripts/test_usage_budget_contract.py

      - name: Run Steps4Tests
        timeout-minutes: 80
        # The HealthStoreTests observer flake (a fixed-sleep wait on a MainActor
        # hop) was fixed by polling deterministically, so the global
        # -retry-tests-on-failure crutch is gone — a flaky test now fails the
        # gate instead of being silently absorbed.
        run: |
          set -o pipefail
          python3 Scripts/capture_test_stalls.py "$RUNNER_TEMP/Steps4Tests.log" "$RUNNER_TEMP/test-stacks" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          xcodebuild test \
            -project Steps4.xcodeproj \
            -scheme Steps4 \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:Steps4Tests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 900 \
            -maximum-test-execution-time-allowance 900 \
            -collect-test-diagnostics on-failure \
            -resultBundlePath "$RUNNER_TEMP/Steps4Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/Steps4Tests.log"

      - name: Retain iOS test results and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/Steps4Tests.xcresult
            ${{ runner.temp }}/Steps4Tests.log
            ${{ runner.temp }}/test-stacks
            ~/Library/Logs/DiagnosticReports
          retention-days: 7
          if-no-files-found: warn

  edge-functions:
    name: Edge Functions unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: node --test supabase/tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Typecheck Edge Functions with frozen dependencies
        run: >-
          deno check --frozen --lock supabase/deno.lock
          supabase/functions/delete-user/index.ts
          supabase/functions/send-push/index.ts

  admin-panel:
    name: admin-panel (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      # Generate Next's route/page type defs (.next/types) — gitignored, so
      # absent on a clean checkout. tsc's tsconfig includes them; without this
      # step the typecheck would differ from local runs. No env vars needed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint

  tg-admin:
    name: tg-admin (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tg-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tg-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
