name: CI

# In-repo quality gate. Previously the only test automation was the Xcode Cloud
# post-clone secret script, configured invisibly in App Store Connect — nothing
# in the repo proved the tests ran. This workflow runs the iOS unit tests and
# verifies the zero-data Health UI and typechecks/lints both TypeScript admin
# surfaces on every push and PR.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS unit tests
    # The app uses the iOS 26 Liquid Glass API (`Glass`), which Xcode 16 cannot
    # parse even behind @available. macOS 26 runners ship Xcode 26.
    runs-on: macos-26
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Create placeholder secrets
        # The build's Info.plist references $(SUPABASE_URL)/$(SUPABASE_ANON_KEY)
        # via Config/Secrets.xcconfig, which is gitignored.
        # Unit tests never hit the network, so the placeholder values from the
        # template are sufficient to compile and run. (Secrets-Dev.xcconfig is
        # optionally included and absent here, so Debug falls back to these.)
        run: cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig

      - name: Check secrets config
        # Catches the two ways this layer rots: an Info.plist growing a new
        # $(VAR) that nobody added to the template (every machine then builds
        # with an empty value), and the real Secrets.xcconfig being committed.
        # Placeholders are NOT rejected here — the step above installs them on
        # purpose, since the unit tests never hit the network. The release path
        # (ci_scripts/ci_post_clone.sh) is where placeholders are fatal.
        run: ./Scripts/check-secrets-config.sh

      - name: Verify Screen Time callback contract
        run: python3 -m unittest discover -s Scripts -p 'test_usage_budget_*.py'

      - name: Verify Canvas palette rollover contract
        run: python3 -m unittest discover -s Scripts -p 'test_palette_rollover.py'

      - name: Verify host audio output
        # Simulator RemoteIO depends on the runner's virtual CoreAudio device.
        # Configure Debug live-audio tests too; an unconfigured route can hang
        # RemoteIO while AVAudioEngine.stop waits for its IO thread to exit.
        # Record and exercise it before launching tests; fail if it cannot play.
        timeout-minutes: 2
        run: |
          system_profiler SPAudioDataType -json > "$RUNNER_TEMP/host-audio.json"
          swift Scripts/configure_ci_audio.swift > "$RUNNER_TEMP/host-audio-routing.json"
          system_profiler SPAudioDataType -json > "$RUNNER_TEMP/host-audio-after.json"
          python3 - <<'PY'
          import os, pathlib, subprocess, wave
          audio = pathlib.Path(os.environ["RUNNER_TEMP"]) / "audio-device-check.wav"
          with wave.open(str(audio), "wb") as output:
              output.setnchannels(2)
              output.setsampwidth(2)
              output.setframerate(44100)
              output.writeframes(bytes(4410 * 4))
          subprocess.run(["afplay", str(audio)], check=True, timeout=30)
          print("Host audio playback completed")
          PY

      - name: Verify zero-data Health UI
        # This first simulator invocation also builds the app and test bundles.
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test \
            -project Nowhere.xcodeproj \
            -scheme Nowhere \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -parallel-testing-enabled NO \
            -only-testing:NowhereUITests/SettingsRedesignUITests/testZeroHealthDataDoesNotClaimConnectionOrProduceUrgentWarning \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/HealthZeroDataUI.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/HealthZeroDataUI.log"

      - name: Run NowhereTests
        # The live 100-remix deadline test and two heavy real-audio lifecycle
        # scenarios run in the required optimized Release job below. All other
        # tests, including deterministic lifecycle/allocation tests, stay in Debug.
        timeout-minutes: 80
        # The HealthStoreTests observer flake (a fixed-sleep wait on a MainActor
        # hop) was fixed by polling deterministically, so the global
        # -retry-tests-on-failure crutch is gone — a flaky test now fails the
        # gate instead of being silently absorbed.
        run: |
          set -o pipefail
          python3 Scripts/capture_test_stalls.py "$RUNNER_TEMP/NowhereTests.log" "$RUNNER_TEMP/test-stacks" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          xcodebuild test \
            -project Nowhere.xcodeproj \
            -scheme Nowhere \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:NowhereTests \
            -skip-testing:NowhereTests/DayObjectsRemixCoordinatorTests/testOneHundredProductionCoordinatorRemixesRecycleBothWorldsAndPreservePhysicalGraphAcrossRestarts \
            -skip-testing:NowhereTests/DayObjectsMusicPlaybackEngineTests/testLiveRuntimeFailedUpgradeDemotesToSampleOwnerThenRetriesAuditionAndStops \
            -skip-testing:NowhereTests/DayObjectsMusicPlaybackEngineTests/testLiveRuntimeHappeningsZeroToTenLoopsPreserveRealAllocationsAndRemoveRecords \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 900 \
            -maximum-test-execution-time-allowance 900 \
            -collect-test-diagnostics on-failure \
            -resultBundlePath "$RUNNER_TEMP/NowhereTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/NowhereTests.log"

      - name: Retain iOS test results and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/HealthZeroDataUI.xcresult
            ${{ runner.temp }}/HealthZeroDataUI.log
            ${{ runner.temp }}/NowhereTests.xcresult
            ${{ runner.temp }}/NowhereTests.log
            ${{ runner.temp }}/test-stacks
            ${{ runner.temp }}/host-audio.json
            ${{ runner.temp }}/host-audio-routing.json
            ${{ runner.temp }}/host-audio-after.json
            ~/Library/Logs/DiagnosticReports
          retention-days: 7
          if-no-files-found: warn

  ios-release-audio:
    name: iOS Release audio and Smudge
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder secrets
        run: cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
      - name: Build production configuration and verify Canvas audio
        run: |
          xcodebuild build \
            -project Nowhere.xcodeproj -scheme Nowhere -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ReleaseAudio" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          python3 Scripts/check_canvas_audio_bundle.py \
            "$RUNNER_TEMP/ReleaseAudio/Build/Products/Release-iphonesimulator/Nowhere.app"

      - name: Verify host audio output
        # Simulator RemoteIO depends on the runner's virtual CoreAudio device.
        # Record and exercise it before launching tests; fail if it cannot play.
        timeout-minutes: 2
        run: |
          system_profiler SPAudioDataType -json > "$RUNNER_TEMP/host-audio.json"
          swift Scripts/configure_ci_audio.swift > "$RUNNER_TEMP/host-audio-routing.json"
          system_profiler SPAudioDataType -json > "$RUNNER_TEMP/host-audio-after.json"
          python3 - <<'PY'
          import os, pathlib, subprocess, wave
          audio = pathlib.Path(os.environ["RUNNER_TEMP"]) / "audio-device-check.wav"
          with wave.open(str(audio), "wb") as output:
              output.setnchannels(2)
              output.setsampwidth(2)
              output.setframerate(44100)
              output.writeframes(bytes(4410 * 4))
          subprocess.run(["afplay", str(audio)], check=True, timeout=30)
          print("Host audio playback completed")
          PY

      - name: Verify Release live audio and Smudge output
        # Realtime rendering is verified with the optimization used by shipped
        # audio code. INTERNAL_BUILD exposes diagnostics, not a substitute graph.
        run: |
          set -o pipefail
          python3 Scripts/capture_test_stalls.py "$RUNNER_TEMP/ReleaseAudio.log" "$RUNNER_TEMP/release-test-stacks" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          xcodebuild test \
            -project Nowhere.xcodeproj -scheme Nowhere -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/ReleaseAudio" \
            -parallel-testing-enabled NO \
            -only-testing:NowhereTests/DayObjectsRemixCoordinatorTests \
            -only-testing:NowhereTests/SmudgePreparationTests \
            -only-testing:NowhereTests/SmudgeWaterRippleTests \
            -only-testing:NowhereTests/SmudgeComputeRegionTests \
            -only-testing:NowhereTests/SmudgeRegionSequenceTests \
            -only-testing:NowhereTests/DayObjectsMusicLabControllerTests/testCanvasLeadReceivesCompleteGestureBeforeSmudgeIsPrepared \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 900 \
            -maximum-test-execution-time-allowance 900 \
            -resultBundlePath "$RUNNER_TEMP/ReleaseSmudge.xcresult" \
            ENABLE_TESTABILITY=YES ENABLE_CODE_COVERAGE=NO \
            'OTHER_SWIFT_FLAGS=$(inherited) -D INTERNAL_BUILD' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/ReleaseAudio.log"

      - name: Verify repeated Release audio lifecycle regressions
        # Unoptimized DSP overload can starve Simulator RemoteIO and abort
        # AVAudioPlayerNode ("player did not see an IO cycle"). Exercise the
        # original assertions with shipped optimization, three fresh-host runs.
        # Any failed repetition fails this gate; there are no failure retries.
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test \
            -project Nowhere.xcodeproj -scheme Nowhere -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/ReleaseAudio" \
            -parallel-testing-enabled NO \
            -only-testing:NowhereTests/DayObjectsMusicPlaybackEngineTests/testLiveRuntimeFailedUpgradeDemotesToSampleOwnerThenRetriesAuditionAndStops \
            -only-testing:NowhereTests/DayObjectsMusicPlaybackEngineTests/testLiveRuntimeHappeningsZeroToTenLoopsPreserveRealAllocationsAndRemoveRecords \
            -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            -collect-test-diagnostics on-failure \
            -resultBundlePath "$RUNNER_TEMP/AudioLifecycleTests.xcresult" \
            ENABLE_TESTABILITY=YES ENABLE_CODE_COVERAGE=NO \
            'OTHER_SWIFT_FLAGS=$(inherited) -D INTERNAL_BUILD' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/AudioLifecycleTests.log"

      - name: Confirm all required live audio tests executed
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ReleaseSmudge.xcresult" --compact > "$RUNNER_TEMP/ReleaseAudioTests.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/AudioLifecycleTests.xcresult" --compact > "$RUNNER_TEMP/AudioLifecycleTests.json"
          python3 - <<'PYCODE'
          import json, os, pathlib
          expected = "DayObjectsRemixCoordinatorTests/testOneHundredProductionCoordinatorRemixesRecycleBothWorldsAndPreservePhysicalGraphAcrossRestarts()"
          found = []
          def visit(node):
              if isinstance(node, dict):
                  if node.get("nodeIdentifier") == expected and node.get("nodeType") == "Test Case":
                      found.append(node.get("result"))
                  for child in node.values(): visit(child)
              elif isinstance(node, list):
                  for child in node: visit(child)
          visit(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "ReleaseAudioTests.json").read_text()))
          assert found == ["Passed"], f"Required live stress test missing, skipped or failed: {found}"
          print("Required optimized 100-remix test passed")
          lifecycle_names = {
              "DayObjectsMusicPlaybackEngineTests/testLiveRuntimeFailedUpgradeDemotesToSampleOwnerThenRetriesAuditionAndStops()",
              "DayObjectsMusicPlaybackEngineTests/testLiveRuntimeHappeningsZeroToTenLoopsPreserveRealAllocationsAndRemoveRecords()",
          }
          lifecycle_results = {}
          def visit_lifecycle(node):
              if isinstance(node, dict):
                  if node.get("nodeType") == "Test Case" and node.get("nodeIdentifier") in lifecycle_names:
                      lifecycle_results[node["nodeIdentifier"]] = [
                          child.get("result") for child in node.get("children", [])
                          if child.get("nodeType") == "Repetition"
                      ]
                  for child in node.values(): visit_lifecycle(child)
              elif isinstance(node, list):
                  for child in node: visit_lifecycle(child)
          visit_lifecycle(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "AudioLifecycleTests.json").read_text()))
          assert lifecycle_results == {name: ["Passed"] * 3 for name in lifecycle_names}, f"Required lifecycle repetitions missing, skipped or failed: {lifecycle_results}"
          print("Both optimized audio lifecycle tests passed all three repetitions")
          PYCODE

      - name: Retain Release audio and Smudge test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smudge-results
          path: |
            ${{ runner.temp }}/ReleaseSmudge.xcresult
            ${{ runner.temp }}/AudioLifecycleTests.xcresult
            ${{ runner.temp }}/AudioLifecycleTests.log
            ${{ runner.temp }}/AudioLifecycleTests.json
            ${{ runner.temp }}/ReleaseAudio.log
            ${{ runner.temp }}/ReleaseAudioTests.json
            ${{ runner.temp }}/release-test-stacks
            ${{ runner.temp }}/host-audio.json
            ${{ runner.temp }}/host-audio-routing.json
            ${{ runner.temp }}/host-audio-after.json
            ~/Library/Logs/DiagnosticReports
          retention-days: 7
          if-no-files-found: warn

  edge-functions:
    name: Edge Functions unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: node --test supabase/tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Typecheck Edge Functions with frozen dependencies
        run: >-
          deno check --frozen --lock supabase/deno.lock
          supabase/functions/delete-user/index.ts
          supabase/functions/send-push/index.ts

  admin-panel:
    name: admin-panel (typecheck + lint + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      # Generate Next's route/page type defs (.next/types) — gitignored, so
      # absent on a clean checkout. tsc's tsconfig includes them; without this
      # step the typecheck would differ from local runs. No env vars needed.
      - run: node --test tests/admin-authorization.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm test

  tg-admin:
    name: tg-admin (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tg-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tg-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
