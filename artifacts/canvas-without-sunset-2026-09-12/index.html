<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas без sunset</title><style>body{max-width:850px;margin:40px auto;padding:0 24px;background:#f4f2ed;color:#222;font:16px/1.5 system-ui}.row{display:flex;gap:24px}figure{margin:16px 0;flex:1}img{width:100%;max-width:300px}h1{font-size:28px}</style><h1>Canvas без sunset</h1><p>Новые фигуры больше не получают sunset. Сохранённые фигуры показывают обычный двухцветный градиент с прежней формой и положением.</p><h2>Canvas</h2><div class="row"><figure><figcaption>До</figcaption><img src="before-saved-sunset-canvas.png"></figure><figure><figcaption>После</figcaption><img src="after-saved-sunset-canvas.png"></figure></div><h2>Меню добавления</h2><div class="row"><figure><figcaption>До</figcaption><img src="before-saved-sunset-picker.png"></figure><figure><figcaption>После</figcaption><img src="after-saved-sunset-picker.png"></figure></div><p>Реальный Metal-рендер в симуляторе. Эта правка пока не устанавливалась на iPhone.</p></html>
